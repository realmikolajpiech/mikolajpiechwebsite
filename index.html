    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var isDark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
